name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.24', '1.25']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Format check
        run: cd v2 && test -z "$(gofmt -l .)"

      - name: Vet
        run: cd v2 && go vet ./...

      - name: Test
        run: cd v2 && go test -race -count=1 ./...

      - name: Build
        run: cd v2 && go build ./...
